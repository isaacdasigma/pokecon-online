<script>
    // ===============================================================
    // ⚙️ SUPABASE CONFIGURATION
    // ===============================================================
    const SUPABASE_URL = "https://vaswszkooyxcqltejjyr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_PZu-jMSkl24fRRAqZHoBXA_aZ-jZIkl";
    const BUCKET_NAME = "Poke-con";

    // Initialize Supabase Client (Renamed to avoid library name collisions)
    let supabaseClient = null;
    if (SUPABASE_URL.includes("YOUR_SUPABASE_PROJECT_ID") === false) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // Fallback data
    const localFallbackBinders = [
        {
            id: "1",
            trainer_name: "Ash_Master",
            title: "1st Edition Shadowless Collection",
            description: "Complete near-mint condition Base Set featuring Charizard, Blastoise, and Venusaur.",
            image_url: "https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?auto=format&fit=crop&w=800&q=80",
            likes: 24
        },
        {
            id: "2",
            trainer_name: "Misty_Gym",
            title: "Water-Type Master Binder",
            description: "Every Water Pokémon holo card from Neo Genesis through Gold & Silver era.",
            image_url: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=800&q=80",
            likes: 18
        }
    ];

    document.addEventListener("DOMContentLoaded", () => {
        loadShowroomBinders();
    });

    // 1. FETCH & DISPLAY BINDERS
    async function loadShowroomBinders() {
        const grid = document.getElementById("binderGrid");
        grid.innerHTML = "<p>Loading cloud showroom photos...</p>";

        let binderList = [];

        if (supabaseClient) {
            try {
                const { data, error } = await supabaseClient.from('binders').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                binderList = data;
            } catch (err) {
                console.warn("Supabase DB fetch error, using fallback.", err);
                binderList = getLocalBinders();
            }
        } else {
            document.getElementById('syncStatus').innerHTML = `⚠️ <strong>Demo Mode:</strong> Add your Supabase credentials to enable multi-device sync for bucket <code>${BUCKET_NAME}</code>.`;
            binderList = getLocalBinders();
        }

        renderGrid(binderList);
    }

    function renderGrid(binders) {
        const grid = document.getElementById("binderGrid");
        if (!binders || binders.length === 0) {
            grid.innerHTML = "<p>No binders uploaded yet. Be the first trainer to share!</p>";
            return;
        }

        grid.innerHTML = binders.map(binder => `
            <div class="binder-card">
                <div class="binder-img-wrap">
                    <span class="trainer-badge">👤 ${escapeHTML(binder.trainer_name)}</span>
                    <img src="${binder.image_url}" alt="${escapeHTML(binder.title)}" loading="lazy">
                </div>
                <div class="binder-body">
                    <div>
                        <h4>${escapeHTML(binder.title)}</h4>
                        <p>${escapeHTML(binder.description || "No description provided.")}</p>
                    </div>
                    <div class="binder-footer">
                        <button class="like-btn" onclick="likeBinder('${binder.id}')">
                            ❤️ <span id="like-count-${binder.id}">${binder.likes || 0}</span>
                        </button>
                        <a href="${binder.image_url}" target="_blank" class="btn" style="padding: 6px 12px; font-size: 11px;">Zoom Photo 🔍</a>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 2. LIKE BINDER FUNCTION (ADDED)
    async function likeBinder(binderId) {
        const countSpan = document.getElementById(`like-count-${binderId}`);
        if (!countSpan) return;

        let currentLikes = parseInt(countSpan.innerText) || 0;
        let newLikes = currentLikes + 1;
        countSpan.innerText = newLikes;

        if (supabaseClient) {
            try {
                await supabaseClient.from('binders').update({ likes: newLikes }).eq('id', binderId);
            } catch (err) {
                console.error("Failed to update likes in database:", err);
            }
        } else {
            const binders = getLocalBinders();
            const binder = binders.find(b => b.id === binderId);
            if (binder) {
                binder.likes = newLikes;
                localStorage.setItem('pokecon_showroom_binders', JSON.stringify(binders));
            }
        }
    }

    // 3. HANDLE FILE UPLOAD TO SUPABASE BUCKET
    async function handleBinderUpload(e) {
        e.preventDefault();

        const fileInput = document.getElementById("binderPhoto");
        const file = fileInput.files[0];
        
        // Check for file BEFORE locking the submit button
        if (!file) {
            alert("Please select an image file first.");
            return;
        }

        const submitBtn = document.getElementById("uploadBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Uploading to Cloud...";

        const trainerName = document.getElementById("trainerName").value;
        const binderTitle = document.getElementById("binderTitle").value;
        const binderDesc = document.getElementById("binderDesc").value;

        try {
            let publicImageUrl = "";

            if (supabaseClient) {
                const fileName = `binder_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                const { uploadData, error: uploadError } = await supabaseClient.storage
                    .from(BUCKET_NAME)
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient.storage
                    .from(BUCKET_NAME)
                    .getPublicUrl(fileName);
                    
                publicImageUrl = urlData.publicUrl;

                const { error: dbError } = await supabaseClient.from('binders').insert([
                    {
                        trainer_name: trainerName,
                        title: binderTitle,
                        description: binderDesc,
                        image_url: publicImageUrl,
                        likes: 0
                    }
                ]);

                if (dbError) throw dbError;

            } else {
                publicImageUrl = await readFileAsDataURL(file);
                const newBinder = {
                    id: Date.now().toString(),
                    trainer_name: trainerName,
                    title: binderTitle,
                    description: binderDesc,
                    image_url: publicImageUrl,
                    likes: 0
                };
                saveLocalBinder(newBinder);
            }

            closeUploadModal();
            loadShowroomBinders();
            alert("🎉 Success! Your binder photo has been published to the Poke-con bucket!");

        } catch (error) {
            console.error("Upload failed:", error);
            alert("Upload failed: " + error.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Upload to Cloud ☁️";
        }
    }

    // HELPERS
    function getLocalBinders() {
        const stored = localStorage.getItem('pokecon_showroom_binders');
        return stored ? JSON.parse(stored) : localFallbackBinders;
    }

    function saveLocalBinder(binder) {
        const current = getLocalBinders();
        current.unshift(binder);
        localStorage.setItem('pokecon_showroom_binders', JSON.stringify(current));
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    }

    function escapeHTML(str) {
        return str ? str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        ) : '';
    }

    function openUploadModal() {
        document.getElementById("uploadModal").style.display = "flex";
    }

    function closeUploadModal() {
        document.getElementById("uploadModal").style.display = "none";
        document.getElementById("binderForm").reset();
    }
</script>
